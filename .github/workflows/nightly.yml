name: Nightly Data + Model Update

on:
  schedule:
    - cron: "0 7 * * *"   # 3:00 AM ET (UTC-4 summer / UTC-5 winter)
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

concurrency:
  group: ${{ github.repository }}-runtime-artifacts
  cancel-in-progress: false

env:
  PITCH_API_KEY: ${{ secrets.PITCH_API_KEY }}
  PITCH_ORACLE_LEAGUE: laliga

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Data fetch ──────────────────────────────────────────────────────

      - name: Fetch historical match data
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python fetch_historical_csvs.py

      - name: Fetch upcoming fixtures
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python fetch_upcoming_fixtures.py

      - name: Refresh optional PitchAPI observations and strict history
        run: python -m pitch_oracle_core.pitchapi.pipeline daily --league laliga --historical-file pitchapi_historical_features.csv

      - name: Fetch xG proxy from historical data
        run: python fetch_fbref_xg.py

      - name: Fetch Copa del Rey fixtures
        run: python fetch_copa_fixtures.py

      - name: Fetch bookmaker odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py --force

      - name: Fetch weather forecast for upcoming fixtures
        run: python fetch_weather_data.py

      # ── Model pipeline ──────────────────────────────────────────────────

      - name: Prepare model-ready features
        run: python prepare_model_data.py

      - name: Train ensemble, Poisson, and neural network models
        run: python train_models.py

      - name: Fit independent PitchAPI baseline and any validated families
        run: python -m pitch_oracle_core.pitchapi.pipeline train --league laliga --historical-file pitchapi_historical_features.csv

      # ── Post-training analysis ──────────────────────────────────────────

      - name: Run historical backtest
        run: python backtest.py

      # ── Pre-generate predictions so the app reads from cache ────────────

      - name: Pre-generate predictions log (ensemble + neural network)
        run: python automation/generate_predictions.py

      - name: Archive lineup and forecast issues
        run: python -m pitch_oracle_core.pitchapi.pipeline hourly --league laliga --historical-file pitchapi_historical_features.csv

      # ── Validate & commit ───────────────────────────────────────────────

      - name: Validate prediction log
        run: python track_predictions.py --validate

      # ── Export best bets for Sports Picks Grid aggregator ───────────────
      - name: Export best bets for Sports Picks Grid
        run: python scripts/export_best_bets.py
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit updated data, models, and predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_files/ models/
          git add -f models/pitchapi_baseline.pkl
          if [ -f models/pitchapi_promoted.pkl ]; then git add -f models/pitchapi_promoted.pkl; fi
          git diff --staged --quiet || git commit -m "chore: nightly update $(date -u +%Y-%m-%d)" -m $'## Generated artifacts\nRefresh primary data, fitted legacy and independent models, provider capability health, and immutable observation/forecast revisions.\n\n## Validation\nThe nightly preparation, training and prediction steps completed before publication.'
          git push
